name: Record Cloudflare deployment

on:
  check_run:
    types: [completed]

permissions:
  checks: read
  contents: read
  deployments: write

jobs:
  record:
    name: Add to GitHub Environments
    if: >-
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Record completed deployment
        uses: actions/github-script@v7
        with:
          script: |
            const checkRun = context.payload.check_run;
            const repository = context.payload.repository;
            const { owner, repo } = context.repo;
            const { data: checkSuite } = await github.rest.checks.getSuite({
              owner,
              repo,
              check_suite_id: checkRun.check_suite.id,
            });
            const branch = checkSuite.head_branch;

            if (!branch) {
              core.setFailed("Cloudflare check suite did not include a source branch.");
              return;
            }

            const isProduction = branch === repository.default_branch;
            const environment = isProduction ? "Production" : "Preview";
            const summary = checkRun.output?.summary ?? "";
            const urlMatch = summary.match(
              /href=['"](https:\/\/[^'"]+\.pages\.dev)['"]/
            );

            if (!urlMatch) {
              core.setFailed("Cloudflare check did not include a pages.dev deployment URL.");
              return;
            }

            const conclusionStates = {
              action_required: "failure",
              cancelled: "inactive",
              failure: "failure",
              neutral: "inactive",
              skipped: "inactive",
              stale: "error",
              success: "success",
              timed_out: "failure",
            };
            const state = conclusionStates[checkRun.conclusion] ?? "error";
            const payload = {
              provider: "cloudflare-pages",
              check_run_id: checkRun.id,
            };

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                sha: checkRun.head_sha,
                environment,
                per_page: 100,
              }
            );
            const existing = deployments.find((deployment) => {
              const deploymentPayload =
                typeof deployment.payload === "string"
                  ? JSON.parse(deployment.payload || "{}")
                  : deployment.payload;

              return (
                deploymentPayload?.provider === payload.provider &&
                deploymentPayload?.check_run_id === payload.check_run_id
              );
            });

            const deployment = existing
              ? existing
              : (
                  await github.rest.repos.createDeployment({
                    owner,
                    repo,
                    ref: checkRun.head_sha,
                    auto_merge: false,
                    required_contexts: [],
                    environment,
                    description: `Cloudflare Pages deployment from ${branch ?? checkRun.head_sha}`,
                    payload,
                    production_environment: isProduction,
                    transient_environment: !isProduction,
                  })
                ).data;

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state,
              description: `Cloudflare Pages check completed with ${checkRun.conclusion}`,
              environment,
              environment_url: urlMatch[1],
              log_url: checkRun.details_url,
              auto_inactive: isProduction,
            });
