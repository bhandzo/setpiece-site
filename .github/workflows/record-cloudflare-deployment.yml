name: Record Cloudflare deployment

on:
  check_run:
    types: [completed]

permissions:
  checks: read
  contents: read
  deployments: write

jobs:
  record:
    name: Add to GitHub Environments
    if: >-
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Record completed deployment
        id: record
        uses: actions/github-script@v7
        with:
          script: |
            const checkRun = context.payload.check_run;
            const repository = context.payload.repository;
            const { owner, repo } = context.repo;
            const { data: checkSuite } = await github.rest.checks.getSuite({
              owner,
              repo,
              check_suite_id: checkRun.check_suite.id,
            });
            const branch = checkSuite.head_branch;

            if (!branch) {
              core.setFailed("Cloudflare check suite did not include a source branch.");
              return;
            }

            const isProduction = branch === repository.default_branch;
            const environment = isProduction ? "Production" : "Preview";
            const summary = checkRun.output?.summary ?? "";
            const urlMatch = summary.match(
              /href=['"](https:\/\/[^'"]+\.pages\.dev)['"]/
            );

            if (!urlMatch) {
              core.setFailed("Cloudflare check did not include a pages.dev deployment URL.");
              return;
            }

            const conclusionStates = {
              action_required: "failure",
              cancelled: "inactive",
              failure: "failure",
              neutral: "inactive",
              skipped: "inactive",
              stale: "error",
              success: "success",
              timed_out: "failure",
            };
            const state = conclusionStates[checkRun.conclusion] ?? "error";
            const payload = {
              provider: "cloudflare-pages",
              check_run_id: checkRun.id,
            };

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                sha: checkRun.head_sha,
                environment,
                per_page: 100,
              }
            );
            const existing = deployments.find((deployment) => {
              const deploymentPayload =
                typeof deployment.payload === "string"
                  ? JSON.parse(deployment.payload || "{}")
                  : deployment.payload;

              return (
                deploymentPayload?.provider === payload.provider &&
                deploymentPayload?.check_run_id === payload.check_run_id
              );
            });

            const deployment = existing
              ? existing
              : (
                  await github.rest.repos.createDeployment({
                    owner,
                    repo,
                    ref: checkRun.head_sha,
                    auto_merge: false,
                    required_contexts: [],
                    environment,
                    description: `Cloudflare Pages deployment from ${branch ?? checkRun.head_sha}`,
                    payload,
                    production_environment: isProduction,
                    transient_environment: !isProduction,
                  })
                ).data;

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state,
              description: `Cloudflare Pages check completed with ${checkRun.conclusion}`,
              environment,
              environment_url: urlMatch[1],
              log_url: checkRun.details_url,
              auto_inactive: isProduction,
            });

            core.setOutput("state", state);
            core.setOutput("environment", environment);
            core.setOutput("branch", branch);
            core.setOutput("url", urlMatch[1]);
            core.setOutput("log_url", checkRun.details_url);
            core.setOutput("sha", checkRun.head_sha);

      - name: Announce deployment in Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_STATE: ${{ steps.record.outputs.state }}
          DEPLOY_ENVIRONMENT: ${{ steps.record.outputs.environment }}
          DEPLOY_BRANCH: ${{ steps.record.outputs.branch }}
          DEPLOY_URL: ${{ steps.record.outputs.url }}
          DEPLOY_LOG_URL: ${{ steps.record.outputs.log_url }}
          DEPLOY_SHA: ${{ steps.record.outputs.sha }}
        with:
          script: |
            const {
              SLACK_WEBHOOK_URL,
              DEPLOY_STATE,
              DEPLOY_ENVIRONMENT,
              DEPLOY_BRANCH,
              DEPLOY_URL,
              DEPLOY_LOG_URL,
              DEPLOY_SHA,
            } = process.env;

            // Slack presentation for each deployment state the recorder can emit.
            const presentation = {
              success: { emoji: ":white_check_mark:", verb: "is live" },
              failure: { emoji: ":x:", verb: "failed" },
              inactive: { emoji: ":fast_forward:", verb: "was skipped" },
              error: { emoji: ":warning:", verb: "errored" },
            };
            const { emoji, verb } = presentation[DEPLOY_STATE] ?? presentation.error;

            const repoUrl = context.payload.repository.html_url;
            const shortSha = DEPLOY_SHA.slice(0, 7);
            const headline = `${emoji} *${DEPLOY_ENVIRONMENT} deploy ${verb}* — <${DEPLOY_URL}|${DEPLOY_URL.replace(/^https:\/\//, "")}>`;

            const response = await fetch(SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                text: `${DEPLOY_ENVIRONMENT} deploy ${verb}: ${DEPLOY_URL}`,
                blocks: [
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: headline },
                  },
                  {
                    type: "context",
                    elements: [
                      {
                        type: "mrkdwn",
                        text: [
                          `\`${DEPLOY_BRANCH}\``,
                          `<${repoUrl}/commit/${DEPLOY_SHA}|${shortSha}>`,
                          `<${DEPLOY_LOG_URL}|Cloudflare build>`,
                        ].join("  ·  "),
                      },
                    ],
                  },
                ],
              }),
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(
                `Slack rejected the deployment notification (${response.status}): ${body}`
              );
            }
