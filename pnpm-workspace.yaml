allowBuilds:
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: false

# Security floors for transitive deps whose parents pin vulnerable ranges.
overrides:
  astro-webmanifest>sharp: ^0.35.5
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.5
  fflate@<0.7.5: ^0.7.5
